name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: familydiet
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d familydiet"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: "postgresql://app:app@127.0.0.1:5432/familydiet?serverVersion=16&charset=utf8"
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: intl, pdo_pgsql
          coverage: none

      - uses: ramsey/composer-install@v3
        with:
          working-directory: backend

      - name: Code style (php-cs-fixer, dry run)
        run: vendor/bin/php-cs-fixer fix --dry-run --diff

      - name: Warm up dev container (для PHPStan symfony-extension)
        run: php bin/console cache:warmup --env=dev

      - name: Static analysis (PHPStan, level 8)
        run: php -d memory_limit=1G vendor/bin/phpstan analyse --no-progress

      - name: Prepare test database
        run: |
          php bin/console doctrine:database:create --env=test --if-not-exists
          php bin/console doctrine:migrations:migrate --env=test --no-interaction

      - name: Tests (PHPUnit)
        run: php bin/phpunit

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Prettier check
        run: npm run format:check

      - name: Build
        run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build production image (Dockerfile для Fly.io)
        run: docker build -t familydiet:ci .

      - name: Smoke — контейнер стартує, конфіг Symfony валідний
        run: |
          docker run --rm -e DATABASE_URL="postgresql://app:app@127.0.0.1:5432/familydiet?serverVersion=16" -e APP_SECRET=ci             familydiet:ci php bin/console about
          docker run --rm familydiet:ci nginx -t

  e2e:
    runs-on: ubuntu-latest
    needs: docker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Стек з production-образу + одноразовий Postgres (міграції, фікстури, демо)
        run: docker compose -f e2e/docker-compose.yml up -d --build --wait

      - name: Playwright
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7

      - name: Логи стеку при падінні
        if: failure()
        run: docker compose -f e2e/docker-compose.yml logs --no-color app init
